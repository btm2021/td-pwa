<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat1 · ATRBot VWAP KC</title>
<script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
    --bg: #0b0e14;
    --panel: #11151e;
    --panel-2: #161b26;
    --line: #1e2431;
    --text: #c9cfdb;
    --muted: #6b7386;
    --accent: #4c8dff;
    --up: #26a69a;
    --down: #ef5350;
    --warn: #e5a50a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }

/* ---------- thanh trên ---------- */
#bar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: .08em; color: var(--muted); font-size: 11px; }
#sym { width: 112px; height: 26px; padding: 0 8px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; text-transform: uppercase; font-weight: 600; letter-spacing: .02em; outline: none; }
#sym:focus { border-color: var(--accent); }
.seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.seg button { border: 0; background: none; padding: 2px 8px; border-radius: 4px; color: var(--muted); cursor: pointer; }
.seg button.on { background: #222a39; color: var(--text); }
.sp { flex: 1; }
.ohlc { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ohlc b { color: var(--text); font-weight: 500; margin-right: 8px; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-s="live"] i { background: var(--up); box-shadow: 0 0 6px var(--up); }
.status[data-s="load"] i { background: var(--warn); }
.status[data-s="err"] i { background: var(--down); }
.icon { width: 26px; height: 26px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; cursor: pointer;
    display: grid; place-items: center; color: var(--muted); }
.icon:hover { color: var(--text); border-color: #2c3445; }

/* ---------- chart + legend ---------- */
#wrap { position: relative; height: calc(100% - 40px); }
#chart { position: absolute; inset: 0; }
#legend { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.row { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 4px 0 6px; border-radius: 4px;
    pointer-events: auto; background: rgba(11, 14, 20, .55); font-variant-numeric: tabular-nums; }
.row:hover { background: rgba(22, 27, 38, .9); }
.row.off .nm, .row.off .val { opacity: .35; }
.sw { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.nm { color: var(--muted); white-space: nowrap; }
.val { color: var(--text); white-space: nowrap; min-width: 40px; }
.val .u { color: var(--up); } .val .d { color: var(--down); }
.row .ic { width: 18px; height: 18px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0;
    display: grid; place-items: center; opacity: 0; border-radius: 3px; }
.row:hover .ic, .row.off .ic.eye { opacity: 1; }
.row .ic:hover { color: var(--text); background: #222a39; }
@media (hover: none) { .row .ic { opacity: 1; } }

/* ---------- popover cài đặt ---------- */
#pop { position: absolute; z-index: 5; width: 248px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45); padding: 10px; }
#pop h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; }
#pop h4 button { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 11px; }
#pop h4 button:hover { color: var(--text); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin-bottom: 8px; }
.f { display: flex; flex-direction: column; gap: 2px; }
.f label, .ln > span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.f input, .f select, .ln select { height: 24px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; outline: none; min-width: 0; }
.f input:focus, .f select:focus { border-color: var(--accent); }
.chk { flex-direction: row; align-items: center; gap: 6px; padding-top: 14px; }
.sec { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; display: flex; flex-direction: column; gap: 6px; }
.ln { display: grid; grid-template-columns: 54px 26px 54px 1fr 16px; gap: 6px; align-items: center; }
.ln select { padding: 0 2px; }
.ln input[type=color], .cl input[type=color] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.ln input[type=checkbox] { margin: 0; }
.cl { display: flex; align-items: center; gap: 6px; }
.cl > span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; width: 58px; }
.cl input[type=range] { flex: 1; accent-color: var(--accent); }

#toast { position: absolute; right: 12px; bottom: 34px; z-index: 6; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; color: var(--text); }
/* ---------- modal cài đặt ---------- */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(4, 6, 10, .62); display: grid; place-items: center; padding: 12px; }
#modal[hidden] { display: none; }
.dlg { width: min(600px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 64px rgba(0, 0, 0, .55); }
.dlg-h { display: flex; align-items: center; padding: 8px 8px 0 12px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 8px 10px 9px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--text); }
.dlg-h .ib { margin-left: auto; margin-bottom: 4px; }
.dlg-b { padding: 14px; overflow: auto; }
.dlg-f { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.frow { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.frow > label:first-child { width: 132px; flex: none; color: var(--muted); }
.frow .seg { padding: 2px; }
.inp, .frow input[type=number] { height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; outline: none; }
.inp { flex: 1; min-width: 0; }
.frow input[type=number] { width: 110px; }
.inp:focus, .frow input[type=number]:focus { border-color: var(--accent); }
.frow input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.frow input[type=range] { width: 120px; accent-color: var(--accent); }
.hint { color: var(--muted); font-size: 11px; }
.sw2 { position: relative; width: 32px; height: 18px; flex: none; cursor: pointer; }
.sw2 input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw2 i { position: absolute; inset: 0; background: #262e3d; border-radius: 9px; transition: background .15s; pointer-events: none; }
.sw2 i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #9aa3b5; transition: transform .15s; }
.sw2 input:checked + i { background: var(--accent); }
.sw2 input:checked + i::after { transform: translateX(14px); background: #fff; }
.sw2 input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { height: 28px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #2c3445; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger:hover, .ib.danger:hover { color: var(--down); border-color: rgba(239, 83, 80, .5); }
.ib { width: 26px; height: 26px; border: 1px solid transparent; background: none; border-radius: 6px; cursor: pointer; color: var(--muted);
    display: inline-grid; place-items: center; }
.ib:hover { color: var(--text); background: var(--panel-2); border-color: var(--line); }
.ib.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.plist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
.pitem > div:first-child { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.pitem b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; gap: 4px; justify-content: flex-end; }
.empty { color: var(--muted); text-align: center; padding: 18px 0; }
.usage { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--muted); font-size: 11px; }
.usage .meter { flex: 1; height: 4px; background: #1c2230; border-radius: 2px; overflow: hidden; }
.usage .meter i { display: block; height: 100%; background: var(--accent); }
.dt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.dt th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding: 0 6px 6px; border-bottom: 1px solid var(--line); }
.dt td { padding: 5px 6px; border-bottom: 1px solid #171c27; white-space: nowrap; }
.dt .r { text-align: right; }
.dt .ok { color: var(--up); } .dt .warn { color: var(--warn); }
.dt .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.tw { overflow-x: auto; }
@media (max-width: 640px) { .frow > label:first-child { width: 104px; } .dt .rng { display: none; } }

@media (max-width: 640px) { .ohlc { display: none; } .brand { display: none; } #bar { gap: 6px; padding: 0 8px; } .seg button { padding: 2px 6px; } }
</style>

<body>
<header id="bar">
    <div class="brand">STAT1</div>
    <input id="sym" spellcheck="false" autocomplete="off" title="Symbol Binance Futures (Enter)">
    <div id="tfs" class="seg"></div>
    <div class="sp"></div>
    <div id="ohlc" class="ohlc"></div>
    <div id="status" class="status" data-s="load"><i></i><span></span></div>
    <button id="settings" class="icon" title="Cài đặt">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
    <button id="reload" class="icon" title="Xoá cache symbol này và tải lại">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
</header>
<main id="wrap">
    <div id="chart"></div>
    <div id="legend"></div>
    <div id="pop" hidden></div>
    <div id="toast" hidden></div>
</main>
<div id="modal" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-label="Cài đặt">
        <div class="dlg-h">
            <div class="tabs"><button data-tab="gen">Chung</button><button data-tab="pre">Preset</button><button data-tab="data">Dữ liệu</button></div>
            <button class="ib" data-close title="Đóng">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="dlg-b" id="dlgBody"></div>
    </div>
</div>

<script>
'use strict';

// ==== INDICATORS ====
// Port 1:1 từ chart/custom_studies/atr-bot.js (ATRBot) + VWAP neo phiên/tuần (UTC) + Keltner (built-in TV).
function srcOf(B, type) {
    const n = B.t.length, out = new Array(n);
    for (let i = 0; i < n; i++) {
        const o = B.o[i], h = B.h[i], l = B.l[i], c = B.c[i];
        out[i] = type === 'open' ? o : type === 'high' ? h : type === 'low' ? l : type === 'hl2' ? (h + l) / 2
            : type === 'hlc3' ? (h + l + c) / 3 : type === 'ohlc4' ? (o + h + l + c) / 4 : c;
    }
    return out;
}
function trueRange(B) {
    const n = B.t.length, tr = new Array(n);
    for (let i = 0; i < n; i++) tr[i] = i === 0 ? B.h[i] - B.l[i]
        : Math.max(B.h[i] - B.l[i], Math.abs(B.h[i] - B.c[i - 1]), Math.abs(B.l[i] - B.c[i - 1]));
    return tr;
}
function ema(x, len) {
    const a = 2 / (len + 1), out = new Array(x.length);
    for (let i = 0; i < x.length; i++) out[i] = i === 0 ? x[i] : a * x[i] + (1 - a) * out[i - 1];
    return out;
}
function rma(x, len) {
    const out = new Array(x.length);
    for (let i = 0; i < x.length; i++) out[i] = i === 0 ? x[i] : (out[i - 1] * (len - 1) + x[i]) / len;
    return out;
}
// WMA trên buffer tối đa `len` phần tử (đầu chuỗi dùng buffer ngắn hơn), giống atr-bot.js
function wmaBuf(x, len) {
    if (len < 1) return x.slice(); // buffer rỗng -> atr-bot.js trả về chính nguồn
    const out = new Array(x.length);
    for (let i = 0; i < x.length; i++) {
        const s = Math.max(0, i - len + 1);
        let num = 0, den = 0;
        for (let j = s, w = 1; j <= i; j++, w++) { num += x[j] * w; den += w; }
        out[i] = num / den;
    }
    return out;
}
const MA = {
    EMA: (x, len) => ema(x, len),
    VIDYA: (x, len) => {
        const out = new Array(x.length), base = 2 / (len + 1);
        for (let i = 0; i < x.length; i++) {
            let up = 0, dn = 0;
            for (let j = Math.max(1, i - len + 1); j <= i; j++) { const d = x[j] - x[j - 1]; if (d > 0) up += d; else dn -= d; }
            const tot = up + dn, k = base * (tot > 0 ? Math.abs((up - dn) / tot) : 0);
            out[i] = i === 0 ? x[i] : k * x[i] + (1 - k) * out[i - 1];
        }
        return out;
    },
    WMA: (x, len) => wmaBuf(x, len),
    HMA: (x, len) => {
        const w1 = wmaBuf(x, Math.floor(len / 2)), w2 = wmaBuf(x, len);
        return wmaBuf(w1.map((v, i) => 2 * v - w2[i]), Math.floor(Math.sqrt(len)));
    },
    KAMA: (x, len) => {
        const out = new Array(x.length), fast = 2 / 3, slow = 2 / 31;
        let prev = NaN;
        for (let i = 0; i < x.length; i++) {
            if (i < len) { out[i] = isNaN(prev) ? x[i] : prev; continue; }
            const change = Math.abs(x[i] - x[i - len]);
            let vol = 0; for (let j = i - len + 1; j <= i; j++) vol += Math.abs(x[j] - x[j - 1]);
            const sc = Math.pow((vol > 0 ? change / vol : 0) * (fast - slow) + slow, 2);
            out[i] = isNaN(prev) ? x[i] : prev + sc * (x[i] - prev);
            prev = out[i];
        }
        return out;
    },
    SMMA: (x, len) => {
        const out = new Array(x.length);
        let prev = NaN, sum = 0;
        for (let i = 0; i < x.length; i++) {
            if (isNaN(prev)) {
                sum += x[i];
                if (i + 1 >= len) { out[i] = prev = sum / len; } else out[i] = x[i];
            } else out[i] = prev = (prev * (len - 1) + x[i]) / len;
        }
        return out;
    },
};
function atrBot(B, p) {
    const t1 = (MA[p.ma] || MA.EMA)(srcOf(B, p.src), p.maLen);
    const atr = rma(trueRange(B), p.atrLen);
    const n = t1.length, t2 = new Array(n), st = new Array(n);
    for (let i = 0; i < n; i++) {
        const a = t1[i], ap = i === 0 ? a : t1[i - 1], bp = i === 0 ? 0 : t2[i - 1], sl = atr[i] * p.mult;
        let b;
        if (a > bp) b = ap > bp ? Math.max(bp, a - sl) : a - sl;
        else b = a < bp && ap < bp ? Math.min(bp, a + sl) : a + sl;
        t2[i] = b;
        st[i] = a > b ? 1 : -1;
    }
    return { t1, t2, st };
}
// VWAP neo: 'day' reset 00:00 UTC, 'week' reset thứ Hai 00:00 UTC. Trước lần reset đầu tiên trả NaN (chu kỳ chưa đủ).
function vwap(B, anchor, src) {
    const DAY = 864e5, n = B.t.length, out = new Array(n), s = srcOf(B, src);
    const period = (ms) => (anchor === 'week' ? Math.floor((ms / DAY + 3) / 7) : Math.floor(ms / DAY));
    const startOf = (p) => (anchor === 'week' ? (p * 7 - 3) * DAY : p * DAY);
    let pv = 0, vv = 0, cur = n ? period(B.t[0]) : 0, full = n && B.t[0] === startOf(cur);
    for (let i = 0; i < n; i++) {
        const p = period(B.t[i]);
        if (p !== cur) { pv = 0; vv = 0; cur = p; full = true; }
        pv += s[i] * B.v[i]; vv += B.v[i];
        out[i] = full ? (vv > 0 ? pv / vv : s[i]) : NaN;
    }
    return out;
}
function keltner(B, p) {
    const basis = ema(srcOf(B, p.src), p.len);
    const rng = ema(p.tr ? trueRange(B) : B.h.map((h, i) => h - B.l[i]), p.len);
    return { basis, upper: basis.map((b, i) => b + p.mult * rng[i]), lower: basis.map((b, i) => b - p.mult * rng[i]) };
}
// ==== END INDICATORS ====

// ---------- lưu trữ ----------
const LS = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch { /* bỏ qua */ } },
    keys(prefix) { const r = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(prefix)) r.push(k); } } catch { /* bỏ qua */ } return r; },
};

const API = 'https://fapi.binance.com/fapi/v1/klines';
// Binance đã tách luồng futures: kline nằm ở /market; /ws cũ vẫn mở kết nối nhưng không gửi dữ liệu
const WS_BASES = ['wss://fstream.binance.com/market/ws/', 'wss://fstream.binance.com/ws/'];
let wsBase = 0;
const TF_MS = { '1m': 6e4, '5m': 3e5, '15m': 9e5, '1h': 36e5, '4h': 144e5, '1d': 864e5 };
const STEP = 50;        // thiếu < 50 nến: 1 request 50 nến; thiếu ≥ 50: tải bù theo trang
const BARS_MIN = 500, BARS_MAX = 50000;
const KEY = (s, tf) => `stat1:bars:${s}:${tf}`;

const SRC = ['close', 'open', 'high', 'low', 'hl2', 'hlc3', 'ohlc4'];
const MAS = Object.keys(MA);
const DEFAULTS = {
    _v: 2,
    candle: { show: true, up: '#0ecb81', down: '#f6465d', opacity: 1 },   // màu chuẩn Binance
    bot: { show: true, atrLen: 14, mult: 2, src: 'hlc3', ma: 'VIDYA', maLen: 14,
        t1: { color: '#26a69a', width: 2, style: 0 }, t2: { color: '#ef5350', width: 2, style: 0 },
        fillUp: '#26a69a', fillDn: '#ef5350', fillOp: 0.15 },
    vd: { show: true, src: 'hlc3', line: { color: '#22c55e', width: 2, style: 0 } },
    vw: { show: true, src: 'hlc3', line: { color: '#f43f5e', width: 2, style: 0 } },
    kc: { show: true, len: 9, mult: 0.5, tr: true, src: 'close',
        band: { color: '#5b8def', width: 1, style: 0 }, basis: { show: false, color: '#5b8def', width: 1, style: 2 },
        fill: '#5b8def', fillOp: 0.12 },
};
// [khoá, nhãn, kiểu]; lines: [khoá, nhãn, có công tắc hiện/ẩn]
const SCHEMA = {
    candle: { name: 'Nến', params: [], lines: [], colors: [['up', 'Tăng'], ['down', 'Giảm']], op: ['opacity', 'Độ đậm'] },
    bot: { name: 'ATRBot', params: [['atrLen', 'ATR', 'int'], ['mult', 'Mult', 'num'], ['src', 'Source', SRC], ['ma', 'MA', MAS], ['maLen', 'MA len', 'int']],
        lines: [['t1', 'Trail 1'], ['t2', 'Trail 2']], colors: [['fillUp', 'Nền ▲'], ['fillDn', 'Nền ▼']], op: ['fillOp', 'Độ đậm'] },
    vd: { name: 'VWAP phiên', params: [['src', 'Source', SRC]], lines: [['line', 'Line']] },
    vw: { name: 'VWAP tuần', params: [['src', 'Source', SRC]], lines: [['line', 'Line']] },

class BandFill {
    constructor() {
        this.d = null; this.on = true;
        const renderer = { draw: (t) => this.draw(t) };
        this.view = { zOrder: () => 'bottom', renderer: () => renderer };
    }
    attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }
    detached() { this.chart = null; }

    updateAllViews() { }
    set(d) { this.d = d; this.req && this.req(); }   // d = { time[], a[], b[], col[] }
    draw(target) {
        const d = this.d;
        if (!this.on || !d || !this.chart) return;
        const ts = this.chart.timeScale(), lr = ts.getVisibleLogicalRange();
        if (!lr) return;
        const n = d.time.length, i0 = Math.max(1, Math.floor(lr.from) - 2), i1 = Math.min(n - 1, Math.ceil(lr.to) + 2);
        target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio: hr, verticalPixelRatio: vr }) => {
            const pt = (i, v) => { const x = ts.timeToCoordinate(d.time[i]), y = this.series.priceToCoordinate(v); return x === null || y === null ? null : [x * hr, y * vr]; };
            // gom các đoạn liên tiếp cùng màu thành 1 đa giác để không bị vệt nối
            let s = i0;
            while (s <= i1) {
                const col = d.col[s];
                let e = s;
                while (e + 1 <= i1 && d.col[e + 1] === col && Number.isFinite(d.a[e + 1]) && Number.isFinite(d.b[e + 1])) e++;
                const top = [], bot = [];
                for (let i = s - 1; i <= e; i++) {
                    if (!Number.isFinite(d.a[i]) || !Number.isFinite(d.b[i])) continue;
                    const p = pt(i, d.a[i]), q = pt(i, d.b[i]);
                    if (p && q) { top.push(p); bot.push(q); }
                }
                if (col && top.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(top[0][0], top[0][1]);
                    for (const p of top) ctx.lineTo(p[0], p[1]);
                    for (let k = bot.length - 1; k >= 0; k--) ctx.lineTo(bot[k][0], bot[k][1]);

                    ctx.fillStyle = col;
                    ctx.fill();
                }

            }
        });

// ---------- realtime ----------
let ws = null, wsTimer = null, saveTimer = null, frame = 0, HEAD = false;
function scheduleSave() {
    clearTimeout(saveTimer);
    const v = VIEW;
    saveTimer = setTimeout(() => v && VIEW === v && saveBars(v.sym, v.tf, B, HEAD, PREC), 2000);
}
function connect() {
    const v = VIEW;
    clearTimeout(wsTimer);
    if (ws) { ws.onclose = null; ws.close(); }
    const sock = ws = new WebSocket(`${WS_BASES[wsBase]}${v.sym.toLowerCase()}@kline_${v.tf}`);
    let got = false;
    ws.onopen = () => {
        setStatus('load', 'chờ dữ liệu');
        // mở được nhưng im lặng quá lâu -> thử endpoint còn lại
        wsTimer = setTimeout(() => { if (!got && ws === sock && VIEW === v) { wsBase = (wsBase + 1) % WS_BASES.length; connect(); } }, 30000);
    };
    ws.onmessage = (m) => {
        if (VIEW !== v) return;
        if (!got) { got = true; clearTimeout(wsTimer); setStatus('live', `${B.t.length} nến`); }
        const k = JSON.parse(m.data).k;
        if (!k) return;
        const bar = [k.t, +k.o, +k.h, +k.l, +k.c, +k.v], last = B.t.length - 1;
        if (bar[0] === B.t[last]) { B.o[last] = bar[1]; B.h[last] = bar[2]; B.l[last] = bar[3]; B.c[last] = bar[4]; B.v[last] = bar[5]; }
        else if (bar[0] === B.t[last] + TF_MS[v.tf]) {
            B.t.push(bar[0]); B.o.push(bar[1]); B.h.push(bar[2]); B.l.push(bar[3]); B.c.push(bar[4]); B.v.push(bar[5]);
            if (B.t.length > PG.bars + 200) { for (const f of Object.keys(B)) B[f] = B[f].slice(-PG.bars); renderAll(); return; }
        }
        else if (bar[0] > B.t[last]) { open(v.sym, v.tf, true); return; } // hụt nến khi mất kết nối -> tải bù
        else return;
        if (k.x) scheduleSave();
        if (!frame) frame = requestAnimationFrame(() => { frame = 0; renderLast(); });
    };
    ws.onclose = () => {
        if (VIEW !== v) return;
        setStatus('load', 'mất kết nối');
        wsTimer = setTimeout(() => VIEW === v && open(v.sym, v.tf, true), 3000);
    };
}

// ---------- mở symbol ----------
let loading = 0;
async function open(sym, tf, quiet = false) {
    sym = sym.trim().toUpperCase();
    if (!sym || !TF_MS[tf]) return;
    const token = ++loading;
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    VIEW = { sym, tf };
    LS.set('stat1:view', VIEW);
    $('#sym').value = sym;
    document.querySelectorAll('#tfs button').forEach((b) => b.classList.toggle('on', b.dataset.tf === tf));
    if (!quiet) setStatus('load', '…');
    const keepRange = quiet ? chart.timeScale().getVisibleLogicalRange() : null;
    try {
        const r = await loadBars(sym, tf, (a, b) => token === loading && setStatus('load', `${Math.round((a / b) * 100)}%`));
        if (token !== loading) return;
        B = r.B; HEAD = r.head; PREC = r.p;
        saveBars(sym, tf, B, HEAD, PREC);
        if (modalTab === 'data') renderTab();
        renderAll();
        if (keepRange) chart.timeScale().setVisibleLogicalRange(keepRange);
        else chart.timeScale().scrollToRealTime();
        $('#status').title = r.info;
        setStatus('load', `${B.t.length} nến`);
        connect();
    } catch (e) {
        if (token !== loading) return;
        setStatus('err', 'lỗi');
        toast(`${sym}: ${e.message}`);
        if (quiet) wsTimer = setTimeout(() => VIEW && open(VIEW.sym, VIEW.tf, true), 10000);
    }
}

            try { const n = importJSON(JSON.parse(fr.result)); renderTab(); toast(`Đã nhập cài đặt${n ? ` + ${n} preset` : ''}`); }
            catch (err) { toast(err.message); }
        };
        fr.readAsText(el.files[0]);
    }
});
$('#modal').addEventListener('input', (e) => {
    const k = e.target.dataset.cd;
    if (!k) return;
    S.candle[k] = k === 'opacity' ? +e.target.value : e.target.value;
    saveSettings(); applyStyles(); buildLegend(); showValues(hoverIdx ?? B.t.length - 1);
});

// ---------- khởi tạo ----------
LS.del('stat1:lru'); // khoá của bản cũ, đã thay bằng stat1:meta
$('#settings').addEventListener('click', () => ($('#modal').hidden ? openModal() : closeModal()));
$('#tfs').innerHTML = Object.keys(TF_MS).map((tf) => `<button data-tf="${tf}">${tf}</button>`).join('');
$('#tfs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && VIEW) open(VIEW.sym, b.dataset.tf); });
$('#sym').addEventListener('keydown', (e) => { if (e.key === 'Enter') { open(e.target.value, VIEW ? VIEW.tf : '15m'); e.target.blur(); } });
$('#reload').addEventListener('click', () => { if (!VIEW) return; LS.del(KEY(VIEW.sym, VIEW.tf)); open(VIEW.sym, VIEW.tf); });
document.addEventListener('visibilitychange', () => {
    // quay lại tab sau thời gian dài: tải phần thiếu
    if (!document.hidden && VIEW && B.t.length && Date.now() - B.t[B.t.length - 1] > 2 * TF_MS[VIEW.tf]) open(VIEW.sym, VIEW.tf, true);
});
buildLegend();
applyStyles();
const v0 = LS.get('stat1:view') || { sym: 'IMXUSDT', tf: '15m' };
open(v0.sym, TF_MS[v0.tf] ? v0.tf : '15m');
</script>
</body>
